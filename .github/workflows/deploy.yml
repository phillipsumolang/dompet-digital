name: Deploy

# The app is static, so the whole pipeline is: check it, build it, publish it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The layout bugs that reached production both rendered correctly in
      # Chromium, so this runs the app in WebKit at phone size before we ship.
      - name: Cache the WebKit build
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Mobile layout smoke test
        run: npm run test:mobile

      - name: Keep the report when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build
        run: npm run build:pages
        env:
          # Pages serves from /<repo>/, and 404.html is what makes a deep
          # link like /budget boot the app instead of showing Pages' own
          # not-found page.
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # RLS is the only thing standing between a stranger and this data, so the
  # policies are attacked on a throwaway Postgres before anything ships.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify row-level security
        run: supabase/verify.sh

  deploy:
    needs: [build, database]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
